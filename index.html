<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C File Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: #16213e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #0f0f1e;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .codestore-btn {
            background: #1a1a2e;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }

        .codestore-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 20px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
        }

        .preview-files {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-list {
            list-style: none;
            padding: 0;
        }

        .file-list li {
            padding: 10px 0;
            border-bottom: 1px solid #333;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .programs-preview {
            margin-top: 20px;
        }

        .program-item {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .program-number {
            font-size: 12px;
            color: #00d4ff;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .program-title {
            font-size: 16px;
            color: #00ff88;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .preview-title {
                font-size: 16px;
            }

            .program-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">C File Generator</div>
            <div class="subtitle">Enter your name and generate your C programs.</div>
            
            <div class="input-group">
                <input 
                    type="text" 
                    id="nameInput" 
                    placeholder="Enter your name"
                    autocomplete="off"
                    oninput="updatePreview()"
                >
            </div>

            <div class="button-group">
                <button class="generate-btn" onclick="generateCFiles()">Generate C Files</button>
                <button class="codestore-btn" onclick="goToCodeStore()">Code Store</button>
            </div>

            <div class="message" id="message"></div>

            <div class="preview-section" id="previewSection">
                <div class="preview-title">Generated Files</div>
                <div class="preview-files">
                    <ul class="file-list" id="fileList"></ul>
                </div>
                
                <div class="programs-preview">
                    <div class="program-item">
                        <div class="program-number">Program 1</div>
                        <div class="program-title">Two Number Input</div>
                    </div>
                    <div class="program-item">
                        <div class="program-number">Program 2</div>
                        <div class="program-title">Arithmetic Operations</div>
                    </div>
                    <div class="program-item">
                        <div class="program-number">Program 3</div>
                        <div class="program-title">Relational Operators</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cPrograms = {
            program1: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("First number = %d\\n", a);
    printf("Second number = %d", b);
    return 0;
}`,
            program2: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("Addition %d\\n", a + b);
    printf("Subtraction %d\\n", a - b);
    printf("Multiplication %d\\n", a * b);
    printf("Division %d\\n", a / b);
    printf("Remainder %d", a % b);
    return 0;
}`,
            program3: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("a > b = %d\\n", a > b);
    printf("a < b = %d\\n", a < b);
    printf("a == b = %d\\n", a == b);
    printf("a != b = %d\\n", a != b);
    printf("a >= b = %d\\n", a >= b);
    printf("a <= b = %d", a <= b);
    return 0;
}`
        };

        function sanitizeFilename(name) {
            // Remove leading and trailing spaces
            name = name.trim();
            // Remove unsafe filename characters, keep only letters, numbers, underscores, hyphens
            name = name.replace(/[^a-zA-Z0-9_-]/g, '');
            return name;
        }

        function showMessage(text, type) {
            const msgElement = document.getElementById('message');
            msgElement.textContent = text;
            msgElement.className = `message ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    msgElement.className = 'message';
                }, 4000);
            }
        }

        function updatePreview() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            const previewSection = document.getElementById('previewSection');

            if (!name) {
                previewSection.classList.remove('active');
                return;
            }

            const sanitized = sanitizeFilename(name);
            if (!sanitized) {
                previewSection.classList.remove('active');
                return;
            }

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = `
                <li>${sanitized}01.c</li>
                <li>${sanitized}02.c</li>
                <li>${sanitized}03.c</li>
            `;

            previewSection.classList.add('active');
        }

        function downloadFile(content, filename) {
            return new Promise((resolve) => {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Give browser time to process download
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    resolve();
                }, 100);
            });
        }

        async function generateCFiles() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value;

            if (!name.trim()) {
                showMessage('Please enter your name.', 'error');
                return;
            }

            const sanitized = sanitizeFilename(name);
            if (!sanitized) {
                showMessage('Please enter a valid name.', 'error');
                return;
            }

            // Download all three files in sequence
            await downloadFile(cPrograms.program1, `${sanitized}01.c`);
            await downloadFile(cPrograms.program2, `${sanitized}02.c`);
            await downloadFile(cPrograms.program3, `${sanitized}03.c`);

            const message = `3 C files generated successfully!\n${sanitized}01.c\n${sanitized}02.c\n${sanitized}03.c`;
            showMessage(message, 'success');
        }

        function goToCodeStore() {
            window.location.href = 'Codestore.html';
        }

        // Allow Enter key to generate
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateCFiles();
            }
        });

        // Initialize preview on load
        updatePreview();
    </script>
</body>
</html>
