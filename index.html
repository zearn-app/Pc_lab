<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C File Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
        }

        .instagram-header {
            background: linear-gradient(135deg, #e4405f, #fd1d1d);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(228, 64, 95, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .instagram-header:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(228, 64, 95, 0.5);
        }

        .instagram-header:active {
            transform: translateY(-1px);
        }

        .logo-container {
            flex-shrink: 0;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            object-fit: cover;
            filter: brightness(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .instagram-text-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .instagram-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .instagram-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .card {
            background: #16213e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .input-group {
            margin-bottom: 35px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #0f0f1e;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .exercise-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #00d4ff;
        }

        .exercise-section:last-child {
            border-bottom: none;
        }

        .exercise-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .codestore-btn {
            background: #1a1a2e;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
            margin-top: 20px;
        }

        .codestore-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 15px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
            white-space: pre-line;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-title {
            font-size: 16px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 15px;
            text-align: center;
        }

        .preview-files {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .file-list li {
            padding: 6px;
            background: #16213e;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .instagram-header {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }

            .instagram-text-container {
                text-align: center;
            }

            .logo-img {
                height: 60px;
                width: 60px;
            }

            .instagram-text {
                font-size: 14px;
            }

            .instagram-subtitle {
                font-size: 12px;
            }

            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .exercise-title {
                font-size: 18px;
            }

            .file-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://www.instagram.com/2k_onito_.064?stkn=MTR1bHNvb29hZmFzMQ==" target="_blank" class="instagram-header">
            <div class="logo-container">
                <img src="idlogo.jpg" alt="Creator Logo" class="logo-img">
            </div>
            <div class="instagram-text-container">
                <div class="instagram-text">@2k_onito_.064</div>
                <div class="instagram-subtitle">Created by</div>
            </div>
        </a>

        <div class="card">
            <div class="title">C File Generator</div>
            <div class="subtitle">Enter your name and generate C programs by exercise.</div>
            
            <div class="input-group">
                <input 
                    type="text" 
                    id="nameInput" 
                    placeholder="Enter your name"
                    autocomplete="off"
                    oninput="updatePreview()"
                >
            </div>

            <!-- Exercise 1: Operators -->
            <div class="exercise-section">
                <div class="exercise-title">Exercise 1: Operators</div>
                <div class="button-group">
                    <button class="generate-btn" onclick="generateExercise1()">Generate Exercise 1 (7 Files)</button>
                </div>
                <div class="message" id="message1"></div>
                <div class="preview-section" id="previewSection1">
                    <div class="preview-title">Exercise 1 Files</div>
                    <div class="preview-files">
                        <ul class="file-list" id="fileList1"></ul>
                    </div>
                </div>
            </div>

            <!-- Exercise 2: Control Flow -->
            <div class="exercise-section">
                <div class="exercise-title">Exercise 2: Control Flow Statements</div>
                <div class="button-group">
                    <button class="generate-btn" onclick="generateExercise2()">Generate Exercise 2 (7 Files)</button>
                </div>
                <div class="message" id="message2"></div>
                <div class="preview-section" id="previewSection2">
                    <div class="preview-title">Exercise 2 Files</div>
                    <div class="preview-files">
                        <ul class="file-list" id="fileList2"></ul>
                    </div>
                </div>
            </div>

            <button class="codestore-btn" onclick="goToCodeStore()">View Code Store</button>
        </div>
    </div>

    <script>
        // Exercise 1: Operators (7 programs)
        const exercise1Programs = {
            program1: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("First number = %d\\n", a);
    printf("Second number = %d", b);
    return 0;
}`,
            program2: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("Addition = %d\\n", a + b);
    printf("Subtraction = %d\\n", a - b);
    printf("Multiplication = %d\\n", a * b);
    printf("Division = %d\\n", a / b);
    printf("Remainder = %d", a % b);
    return 0;
}`,
            program3: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("a > b = %d\\n", a > b);
    printf("a < b = %d\\n", a < b);
    printf("a == b = %d\\n", a == b);
    printf("a != b = %d\\n", a != b);
    printf("a >= b = %d\\n", a >= b);
    printf("a <= b = %d", a <= b);
    return 0;
}`,
            program4: `#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("(a > 0 && b > 0) = %d\\n", (a > 0 && b > 0));
    printf("(a > 0 || b > 0) = %d\\n", (a > 0 || b > 0));
    printf("!(a > 0) = %d", !(a > 0));
    return 0;
}`,
            program5: `#include <stdio.h>

int main() {
    int a;
    a = 10;
    printf("Initial value = %d\\n", a);
    a++;
    printf("After increment = %d\\n", a);
    a--;
    printf("After decrement = %d", a);
    return 0;
}`,
            program6: `#include <stdio.h>

int main() {
    int a, b, c, result;
    printf("Enter three numbers: ");
    scanf("%d %d %d", &a, &b, &c);
    result = a + b * c;
    printf("Result = %d", result);
    return 0;
}`,
            program7: `#include <stdio.h>

int main() {
    int a, b, largest;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    largest = (a > b) ? a : b;
    printf("Largest = %d", largest);
    return 0;
}`
        };

        // Exercise 2: Control Flow Statements (7 programs)
        const exercise2Programs = {
            program1: `#include <stdio.h>

int main() {
    int n;
    printf("Enter a number: ");
    scanf("%d", &n);
    if (n > 0)
        printf("The number is positive.");
    return 0;
}`,
            program2: `#include <stdio.h>

int main() {
    int n;
    printf("Enter a number: ");
    scanf("%d", &n);
    if (n % 2 == 0)
        printf("Even number");
    else
        printf("Odd number");
    return 0;
}`,
            program3: `#include <stdio.h>

int main() {
    int a, b, c, largest;
    printf("Enter three numbers: ");
    scanf("%d %d %d", &a, &b, &c);
    if (a > b) {
        if (a > c)
            largest = a;
        else
            largest = c;
    } else {
        if (b > c)
            largest = b;
        else
            largest = c;
    }
    printf("Largest = %d", largest);
    return 0;
}`,
            program4: `#include <stdio.h>

int main() {
    int n;
input:
    printf("Enter a positive number: ");
    scanf("%d", &n);
    if (n <= 0)
        goto input;
    printf("You entered %d", n);
    return 0;
}`,
            program5: `#include <stdio.h>

int main() {
    int day;
    printf("Enter a number (1-3): ");
    scanf("%d", &day);
    switch (day) {
        case 1:
            printf("Monday");
            break;
        case 2:
            printf("Tuesday");
            break;
        case 3:
            printf("Wednesday");
            break;
        default:
            printf("Invalid choice");
    }
    return 0;
}`,
            program6: `#include <stdio.h>

int main() {
    int i;
    for (i = 1; i <= 10; i++) {
        if (i == 5)
            break;
        printf("%d ", i);
    }
    return 0;
}`,
            program7: `#include <stdio.h>

int main() {
    int i;
    for (i = 1; i <= 10; i++) {
        if (i == 5)
            continue;
        printf("%d ", i);
    }
    return 0;
}`
        };

        function sanitizeFilename(name) {
            name = name.trim();
            name = name.replace(/[^a-zA-Z0-9_-]/g, '');
            return name;
        }

        function showMessage(msgId, text, type) {
            const msgElement = document.getElementById(msgId);
            msgElement.textContent = text;
            msgElement.className = `message ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    msgElement.className = 'message';
                }, 5000);
            }
        }

        function updatePreview() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();

            if (!name) {
                document.getElementById('previewSection1').classList.remove('active');
                document.getElementById('previewSection2').classList.remove('active');
                return;
            }

            const sanitized = sanitizeFilename(name);
            if (!sanitized) {
                document.getElementById('previewSection1').classList.remove('active');
                document.getElementById('previewSection2').classList.remove('active');
                return;
            }

            // Update Exercise 1 preview
            const fileList1 = document.getElementById('fileList1');
            let html1 = '';
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                html1 += `<li>${sanitized}${num}.c</li>`;
            }
            fileList1.innerHTML = html1;
            document.getElementById('previewSection1').classList.add('active');

            // Update Exercise 2 preview
            const fileList2 = document.getElementById('fileList2');
            let html2 = '';
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                html2 += `<li>${sanitized}${num}.c</li>`;
            }
            fileList2.innerHTML = html2;
            document.getElementById('previewSection2').classList.add('active');
        }

        function downloadFile(content, filename) {
            return new Promise((resolve) => {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    resolve();
                }, 100);
            });
        }

        async function generateExercise1() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value;

            if (!name.trim()) {
                showMessage('message1', 'Please enter your name.', 'error');
                return;
            }

            const sanitized = sanitizeFilename(name);
            if (!sanitized) {
                showMessage('message1', 'Please enter a valid name.', 'error');
                return;
            }

            // Download all 7 files for Exercise 1
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                const key = `program${i}`;
                await downloadFile(exercise1Programs[key], `${sanitized}${num}.c`);
            }

            let message = 'Exercise 1: 7 C files generated successfully!\n\n';
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                message += `${sanitized}${num}.c\n`;
            }
            showMessage('message1', message, 'success');
        }

        async function generateExercise2() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value;

            if (!name.trim()) {
                showMessage('message2', 'Please enter your name.', 'error');
                return;
            }

            const sanitized = sanitizeFilename(name);
            if (!sanitized) {
                showMessage('message2', 'Please enter a valid name.', 'error');
                return;
            }

            // Download all 7 files for Exercise 2
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                const key = `program${i}`;
                await downloadFile(exercise2Programs[key], `${sanitized}${num}.c`);
            }

            let message = 'Exercise 2: 7 C files generated successfully!\n\n';
            for (let i = 1; i <= 7; i++) {
                const num = String(i).padStart(2, '0');
                message += `${sanitized}${num}.c\n`;
            }
            showMessage('message2', message, 'success');
        }

        function goToCodeStore() {
            window.location.href = 'Codestore.html';
        }

        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateExercise1();
            }
        });

        updatePreview();
    </script>
</body>
</html>
