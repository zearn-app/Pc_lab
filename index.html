!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C File Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
        }

        .instagram-header {
            background: #E1306C;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(225, 48, 108, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .instagram-header:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(225, 48, 108, 0.5);
        }

        .instagram-header:active {
            transform: translateY(-1px);
        }

        .logo-container {
            flex-shrink: 0;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            object-fit: cover;
            filter: brightness(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .instagram-text-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .instagram-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .instagram-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .card {
            background: #16213e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .input-group {
            margin-bottom: 35px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #0f0f1e;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .exercise-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #00d4ff;
        }

        .exercise-section:last-child {
            border-bottom: none;
        }

        .exercise-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .codestore-btn {
            background: #1a1a2e;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
            margin-top: 20px;
        }

        .codestore-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 15px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
            white-space: pre-line;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-title {
            font-size: 16px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 15px;
            text-align: center;
        }

        .preview-files {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .file-list li {
            padding: 6px;
            background: #16213e;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .instagram-header {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }

            .instagram-text-container {
                text-align: center;
            }

            .logo-img {
                height: 60px;
                width: 60px;
            }

            .instagram-text {
                font-size: 14px;
            }

            .instagram-subtitle {
                font-size: 12px;
            }

            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .exercise-title {
                font-size: 18px;
            }

            .file-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
