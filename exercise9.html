<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Exercise 9</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
        }

        .instagram-header {
            background: #E1306C;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(225, 48, 108, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .instagram-header:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(225, 48, 108, 0.5);
        }

        .logo-container {
            flex-shrink: 0;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            object-fit: cover;
            filter: brightness(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .instagram-text-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .instagram-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .instagram-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            flex: 1;
            min-width: 200px;
        }

        .back-btn {
            background: #1a1a2e;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .back-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .card {
            background: #16213e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #0f0f1e;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .exercise-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #00d4ff;
        }

        .exercise-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .aim-btn {
            background: #1a1a2e;
            color: #00ff88;
            border: 2px solid #00ff88;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
        }

        .aim-btn:hover {
            background: #00ff88;
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 15px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
            white-space: pre-line;
        }

        .preview-section {
            display: none;
            margin-bottom: 20px;
        }

        .preview-section.active {
            display: block;
        }

        .preview-title {
            font-size: 15px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 12px;
            text-align: center;
        }

        .preview-files {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
        }

        .file-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .file-list li {
            padding: 6px;
            background: #16213e;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-align: center;
        }

        .program-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            margin: 25px 0 8px 0;
        }

        .program-aim {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .code-block {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
        }

        .code-block code {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff88;
            line-height: 1.5;
            white-space: pre;
            display: block;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .instagram-header {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }

            .instagram-text-container {
                text-align: center;
            }

            .logo-img {
                height: 60px;
                width: 60px;
            }

            .instagram-text {
                font-size: 14px;
            }

            .title {
                font-size: 24px;
            }

            .card {
                padding: 20px 16px;
            }

            .exercise-title {
                font-size: 17px;
            }

            .file-list {
                grid-template-columns: 1fr;
            }

            .code-block code {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://www.instagram.com/2k_onito_.064?stkn=MTR1bHNvb29hZmFzMQ==" target="_blank" class="instagram-header">
            <div class="logo-container">
                <img src="idlogo.jpg" alt="Creator Logo" class="logo-img">
            </div>
            <div class="instagram-text-container">
                <div class="instagram-text">@2k_onito_.064</div>
                <div class="instagram-subtitle">Created by</div>
            </div>
        </a>

        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back to Generator</button>
            <div class="title">Exercise 9</div>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off" oninput="updatePreview()">
            </div>

            <div id="exercises"></div>

            <div class="exercise-title" style="margin-top: 10px;">Code Listings</div>
            <div id="codes"></div>
        </div>
    </div>

    <script>
        // ===== Exercise data =====
        const exercises = [
            {
                id: 9,
                start: 41,
                title: 'Exercise 9: File Handling in C',
                aim: 'To understand file handling in C: writing, reading, character-level file access, appending data, and moving the file position with rewind().',
                programs: [
                    {
                        title: 'Write Data into a File',
                        aim: 'To write data into a file using fprintf().',
                        algorithm: [
                            'Start the program.',
                            'Declare a file pointer.',
                            'Open a file in write mode using fopen().',
                            'Write data using fprintf().',
                            'Close the file using fclose().',
                            'Display a success message and stop.'
                        ],
                        output: 'Data written successfully\n\nContents of student.txt:\nName: Arun\nDepartment: CSE\nMark: 85',
                        code: String.raw`#include <stdio.h>

int main()
{
    FILE *fp;

    fp = fopen("student.txt", "w");

    if (fp == NULL)
    {
        printf("Unable to open file");
        return 1;
    }
    fprintf(fp, "Name: Arun\n");
    fprintf(fp, "Department: CSE\n");
    fprintf(fp, "Mark: 85\n");
    fclose(fp);
    printf("Data written successfully");
    return 0;
}`
                    },
                    {
                        title: 'Read Data from a File',
                        aim: 'To read and display data from a file using fgets().',
                        algorithm: [
                            'Start the program.',
                            'Open student.txt in read mode.',
                            'Check whether the file opened successfully.',
                            'Read the contents line by line using fgets().',
                            'Display the contents on the screen.',
                            'Close the file and stop.'
                        ],
                        output: 'Name: Arun\nDepartment: CSE\nMark: 85',
                        code: String.raw`#include <stdio.h>

int main()
{
    FILE *fp;
    char line[100];

    fp = fopen("student.txt", "r");

    if (fp == NULL)
    {
        printf("File not found");
        return 1;
    }
    while (fgets(line, sizeof(line), fp) != NULL)
    {
        printf("%s", line);
    }
    fclose(fp);
    return 0;
}`
                    },
                    {
                        title: 'Demonstrate a File Pointer (fputc and fgetc)',
                        aim: 'To demonstrate the use of a file pointer and the fputc() and fgetc() functions.',
                        algorithm: [
                            'Start the program.',
                            'Declare a file pointer.',
                            'Open a file in write mode and write characters.',
                            'Close the file and reopen it in read mode.',
                            'Read the characters using fgetc().',
                            'Display the characters and close the file.'
                        ],
                        output: 'C AI',
                        code: String.raw`#include <stdio.h>

int main()
{
    FILE *fp;
    int ch;

    fp = fopen("letters.txt", "w");

    if (fp == NULL)
    {
        printf("Unable to open file");
        return 1;
    }

    fputc('C', fp);
    fputc(' ', fp);
    fputc('A', fp);
    fputc('I', fp);

    fclose(fp);

    fp = fopen("letters.txt", "r");

    if (fp == NULL)
    {
        printf("Unable to read file");
        return 1;
    }

    while ((ch = fgetc(fp)) != EOF)
    {
        putchar(ch);
    }

    fclose(fp);
    return 0;
}`
                    },
                    {
                        title: 'Append Data to a File',
                        aim: 'To add new data to an existing file using append mode.',
                        algorithm: [
                            'Start the program.',
                            'Open a file in append mode using fopen().',
                            'Check whether the file opened successfully.',
                            'Add new data using fprintf().',
                            'Close the file.',
                            'Display a success message and stop.'
                        ],
                        output: 'Data appended successfully\n\nAfter the first run, details.txt contains:\nNew record added\n\nAfter a second run:\nNew record added\nNew record added',
                        code: String.raw`#include <stdio.h>

int main()
{
    FILE *fp;

    fp = fopen("details.txt", "a");

    if (fp == NULL)
    {
        printf("Unable to open file");
        return 1;
    }
    fprintf(fp, "New record added\n");
    fclose(fp);
    printf("Data appended successfully");
    return 0;
}`
                    },
                    {
                        title: 'Move the File Position using rewind()',
                        aim: 'To move the file position back to the beginning using rewind().',
                        algorithm: [
                            'Start the program.',
                            'Open a file in write mode and write HELLO.',
                            'Close and reopen the file in read mode.',
                            'Read and display the first character.',
                            'Use rewind() to move to the beginning.',
                            'Read and display the first character again.',
                            'Close the file and stop.'
                        ],
                        output: 'First character: H\nAfter rewind: H',
                        code: String.raw`#include <stdio.h>

int main()
{
    FILE *fp;
    int ch;

    fp = fopen("sample.txt", "w");

    if (fp == NULL)
    {
        printf("Unable to open file");
        return 1;
    }

    fprintf(fp, "HELLO");
    fclose(fp);

    fp = fopen("sample.txt", "r");

    if (fp == NULL)
    {
        printf("Unable to read file");
        return 1;
    }

    ch = fgetc(fp);
    printf("First character: %c\n", ch);

    rewind(fp);

    ch = fgetc(fp);
    printf("After rewind: %c\n", ch);

    fclose(fp);
    return 0;
}`
                    }
                ]
            }
        ];

        // ===== Helpers =====
        function sanitizeFilename(name) {
            name = name.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            // Turbo C++ limit: 8 characters before .c
            // 2 chars for the file number (or "A9" for the aim file), so max 6 for name
            if (name.length > 6) {
                name = name.substring(0, 6);
            }
            return name;
        }

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function getName() {
            return sanitizeFilename(document.getElementById('nameInput').value);
        }

        function showMessage(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `message ${type}`;
            if (type === 'success') {
                setTimeout(() => { el.className = 'message'; }, 6000);
            }
        }

        function downloadFile(content, filename) {
            return new Promise((resolve) => {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    resolve();
                }, 100);
            });
        }

        function aimFileName(ex, s) {
            return `${s}A${ex.id}.c`;
        }

        function codeFileNames(ex, s) {
            return ex.programs.map((p, idx) => `${s}${pad(ex.start + idx)}.c`);
        }

        function buildAim(ex) {
            let out = '/*\n';
            out += '==================================================\n';
            out += `${ex.title.toUpperCase()}\n`;
            out += 'AIM AND PROCEDURES\n';
            out += '==================================================\n\n';
            out += 'AIM OF THE EXERCISE:\n';
            out += `${ex.aim}\n`;
            ex.programs.forEach((p, idx) => {
                out += '\n--------------------------------------------------\n';
                out += `PROGRAM ${idx + 1} (File ${pad(ex.start + idx)}): ${p.title}\n`;
                out += '--------------------------------------------------\n';
                out += `AIM:\n    ${p.aim}\n\n`;
                out += 'ALGORITHM:\n';
                p.algorithm.forEach((step, n) => {
                    out += `    ${n + 1}. ${step}\n`;
                });
                out += `\nSAMPLE OUTPUT:\n${p.output.split('\n').map(l => '    ' + l).join('\n')}\n`;
            });
            out += '\n*/\n';
            return out;
        }

        // ===== Generators =====
        function checkName(msgId) {
            if (!document.getElementById('nameInput').value.trim()) {
                showMessage(msgId, 'Please enter your name.', 'error');
                return null;
            }
            const s = getName();
            if (!s) {
                showMessage(msgId, 'Please enter a valid name.', 'error');
                return null;
            }
            return s;
        }

        async function generateCodeFiles(exIndex) {
            const ex = exercises[exIndex];
            const msgId = `msg-${ex.id}`;
            const s = checkName(msgId);
            if (!s) return;
            const files = codeFileNames(ex, s);
            for (let i = 0; i < ex.programs.length; i++) {
                await downloadFile(ex.programs[i].code, files[i]);
            }
            showMessage(msgId, `Exercise ${ex.id}: ${files.length} C files generated successfully!\n\n${files.join('\n')}`, 'success');
        }

        async function generateAimFile(exIndex) {
            const ex = exercises[exIndex];
            const msgId = `msg-${ex.id}`;
            const s = checkName(msgId);
            if (!s) return;
            const file = aimFileName(ex, s);
            await downloadFile(buildAim(ex), file);
            showMessage(msgId, `Exercise ${ex.id} aim file generated successfully!\n\n${file}`, 'success');
        }

        // ===== Page rendering =====
        function renderExercises() {
            const container = document.getElementById('exercises');
            const codes = document.getElementById('codes');

            exercises.forEach((ex, exIndex) => {
                const section = document.createElement('div');
                section.className = 'exercise-section';

                const title = document.createElement('div');
                title.className = 'exercise-title';
                title.textContent = `${ex.title} (Files ${ex.start}-${ex.start + ex.programs.length - 1})`;
                section.appendChild(title);

                const buttons = document.createElement('div');
                buttons.className = 'button-group';

                const codeBtn = document.createElement('button');
                codeBtn.className = 'generate-btn';
                codeBtn.textContent = `Generate Code Files (${ex.programs.length})`;
                codeBtn.addEventListener('click', () => generateCodeFiles(exIndex));
                buttons.appendChild(codeBtn);

                const aimBtn = document.createElement('button');
                aimBtn.className = 'aim-btn';
                aimBtn.textContent = 'Generate Aim File';
                aimBtn.addEventListener('click', () => generateAimFile(exIndex));
                buttons.appendChild(aimBtn);

                section.appendChild(buttons);

                const msg = document.createElement('div');
                msg.className = 'message';
                msg.id = `msg-${ex.id}`;
                section.appendChild(msg);

                const preview = document.createElement('div');
                preview.className = 'preview-section';
                preview.id = `prev-${ex.id}`;
                const pTitle = document.createElement('div');
                pTitle.className = 'preview-title';
                pTitle.textContent = 'Files to be generated';
                const pBox = document.createElement('div');
                pBox.className = 'preview-files';
                const list = document.createElement('ul');
                list.className = 'file-list';
                list.id = `list-${ex.id}`;
                pBox.appendChild(list);
                preview.appendChild(pTitle);
                preview.appendChild(pBox);
                section.appendChild(preview);

                container.appendChild(section);

                const exHeader = document.createElement('div');
                exHeader.className = 'exercise-title';
                exHeader.style.marginTop = '30px';
                exHeader.textContent = ex.title;
                codes.appendChild(exHeader);

                ex.programs.forEach((p, idx) => {
                    const h = document.createElement('div');
                    h.className = 'program-title';
                    h.textContent = `${pad(ex.start + idx)}. ${p.title}`;
                    codes.appendChild(h);

                    const a = document.createElement('div');
                    a.className = 'program-aim';
                    a.textContent = p.aim;
                    codes.appendChild(a);

                    const pre = document.createElement('pre');
                    pre.className = 'code-block';
                    const code = document.createElement('code');
                    code.textContent = p.code;
                    pre.appendChild(code);
                    codes.appendChild(pre);
                });
            });
        }

        function updatePreview() {
            const s = getName();
            exercises.forEach((ex) => {
                const previewEl = document.getElementById(`prev-${ex.id}`);
                const list = document.getElementById(`list-${ex.id}`);
                if (!s) {
                    previewEl.classList.remove('active');
                    return;
                }
                const items = [...codeFileNames(ex, s), aimFileName(ex, s)];
                list.innerHTML = '';
                items.forEach((name) => {
                    const li = document.createElement('li');
                    li.textContent = name;
                    list.appendChild(li);
                });
                previewEl.classList.add('active');
            });
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        renderExercises();
        updatePreview();
    </script>
</body>
</html>
