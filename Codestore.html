<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Code Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: #1a1a2e;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            flex: 1;
            min-width: 200px;
        }

        .card {
            background: #16213e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }

        .code-title {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .code-description {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .code-block {
            background: #0f0f1e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            overflow-x: auto;
        }

        .code-block code {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff88;
            line-height: 1.6;
            white-space: pre;
            display: block;
        }

        .use-btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .use-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .use-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .title {
                font-size: 28px;
                width: 100%;
            }

            .card {
                padding: 20px;
            }

            .code-title {
                font-size: 20px;
            }

            .code-block code {
                font-size: 12px;
            }

            .use-btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back to Generator</button>
            <div class="title">C Code Store</div>
        </div>

        <div class="card">
            <div class="code-title">Two Number Input Program</div>
            <div class="code-description">
                Reads two integers and displays them separately.
            </div>

            <div class="code-block">
                <code>#include &lt;stdio.h&gt;

int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("First number = %d\n", a);
    printf("Second number = %d", b);
    return 0;
}</code>
            </div>

            <button class="use-btn" onclick="useThisCode()">Use This Code</button>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'index.html';
        }

        function useThisCode() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
